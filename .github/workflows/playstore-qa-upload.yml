name: Play Store QA Upload

on:
  workflow_dispatch:
    inputs:
      release_status:
        description: "Play release status"
        required: true
        default: "draft"
        type: choice
        options:
          - draft
          - completed
          - inProgress
      track:
        description: "Play track"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

permissions:
  contents: read

jobs:
  upload-qa:
    runs-on: ubuntu-latest
    env:
      # Signing + versioning used by androidApp/build.gradle.kts
      HF_RELEASE_STORE_FILE: ${{ github.workspace }}/android-release.jks
      HF_RELEASE_STORE_PASSWORD: ${{ secrets.HF_RELEASE_STORE_PASSWORD }}
      HF_RELEASE_KEY_ALIAS: ${{ secrets.HF_RELEASE_KEY_ALIAS }}
      HF_RELEASE_KEY_PASSWORD: ${{ secrets.HF_RELEASE_KEY_PASSWORD }}
      HF_VERSION_CODE: ${{ github.run_number }}
      HF_VERSION_NAME: 1.0-qa.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Android release keystore
        run: echo "${{ secrets.HF_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$HF_RELEASE_STORE_FILE"

      - name: Build QA release bundle
        run: ./gradlew :androidApp:bundleQaRelease --stacktrace

      - name: Upload QA bundle to Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.hk.habitflow.qa
          releaseFiles: androidApp/build/outputs/bundle/qaRelease/androidApp-qa-release.aab
          track: ${{ github.event.inputs.track }}
          status: ${{ github.event.inputs.release_status }}
